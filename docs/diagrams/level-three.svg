<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180"><rect width="1440" height="1180" fill="white"/><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#334155"/></marker><marker id="triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0L13 7L0 14Z" fill="white" stroke="#334155"/></marker></defs><text x="40" y="40" font-family="Arial" font-size="25">Level 3 — Persistence, exploration, forecast comparison and charts (implemented)</text><text x="40" y="72" font-family="Arial" font-size="13" fill="#475569">Green: cli/. Blue: application/. Purple: persistence/, exploration/, charts/ (new). Amber: forecasting methods and comparison (new). Gray: level 1, unchanged.</text><rect x="40" y="110" width="420" height="169" fill="#ecfdf5" stroke="#334155"/><path d="M40 145H460" stroke="#334155"/><text x="52" y="134" font-family="Arial" font-size="16">TerminalMenu</text><text x="52" y="166" font-family="Arial" font-size="13">options 1-12 (level 2) and 13-22 (level 3)</text><text x="52" y="186" font-family="Arial" font-size="13">13-17 edit company/product, delete product/sale, list sales</text><text x="52" y="206" font-family="Arial" font-size="13">18-19 sales over time, compare periods</text><text x="52" y="226" font-family="Arial" font-size="13">20 compare forecast methods</text><text x="52" y="246" font-family="Arial" font-size="13">21-22 text charts, save chart images</text><text x="52" y="266" font-family="Arial" font-size="13">persistent mode: exit needs no confirmation</text><rect x="520" y="110" width="420" height="129" fill="#ecfdf5" stroke="#334155"/><path d="M520 145H940" stroke="#334155"/><text x="532" y="134" font-family="Arial" font-size="16">formatting «module»</text><text x="532" y="166" font-family="Arial" font-size="13">format_sales(); format_table()</text><text x="532" y="186" font-family="Arial" font-size="13">format_temporal(); format_weekdays(); format_categories()</text><text x="532" y="206" font-family="Arial" font-size="13">format_period_comparison()</text><text x="532" y="226" font-family="Arial" font-size="13">format_comparison(); format_comparison_estimates()</text><rect x="1000" y="110" width="400" height="109" fill="#ecfdf5" stroke="#334155"/><path d="M1000 145H1400" stroke="#334155"/><text x="1012" y="134" font-family="Arial" font-size="16">run(argv) «entry point»</text><text x="1012" y="166" font-family="Arial" font-size="13">--database PATH (default: per-user data folder)</text><text x="1012" y="186" font-family="Arial" font-size="13">opens SQLiteSalesRepository; SalesSession.open()</text><text x="1012" y="206" font-family="Arial" font-size="13">exit status 2 when the file cannot be used</text><rect x="40" y="360" width="420" height="149" fill="#eff6ff" stroke="#334155"/><path d="M40 395H460" stroke="#334155"/><text x="52" y="384" font-family="Arial" font-size="16">SalesSession</text><text x="52" y="416" font-family="Arial" font-size="13">open(repository) «classmethod»</text><text x="52" y="436" font-family="Arial" font-size="13">update_company(name?, sector?)</text><text x="52" y="456" font-family="Arial" font-size="13">sales_over_time(); weekday_profile(); category_totals()</text><text x="52" y="476" font-family="Arial" font-size="13">compare_periods(first, second: Selection)</text><text x="52" y="496" font-family="Arial" font-size="13">compare_forecasts(horizon, missing_days, utc_offset, method)</text><rect x="520" y="360" width="420" height="129" fill="#eff6ff" stroke="#334155"/><path d="M520 395H940" stroke="#334155"/><text x="532" y="384" font-family="Arial" font-size="16">CompanyWorkspace</text><text x="532" y="416" font-family="Arial" font-size="13">from_stored(stored, repository) «classmethod»</text><text x="532" y="436" font-family="Arial" font-size="13">update_product(); delete_product(); sales_with_product()</text><text x="532" y="456" font-family="Arial" font-size="13">find_sale(); list_sales(); delete_sale()</text><text x="532" y="476" font-family="Arial" font-size="13">validate -&gt; write to repository -&gt; swap memory</text><rect x="1000" y="360" width="400" height="149" fill="#eff6ff" stroke="#334155"/><path d="M1000 395H1400" stroke="#334155"/><text x="1012" y="384" font-family="Arial" font-size="16">SalesRepository «abstract»</text><text x="1012" y="416" font-family="Arial" font-size="13">load(): tuple[StoredCompany, ...]</text><text x="1012" y="436" font-family="Arial" font-size="13">add_company(); update_company()</text><text x="1012" y="456" font-family="Arial" font-size="13">add_product(); update_product(); delete_product()</text><text x="1012" y="476" font-family="Arial" font-size="13">add_sales(); delete_sale(); close()</text><text x="1012" y="496" font-family="Arial" font-size="13">location: str | None</text><rect x="1000" y="880" width="400" height="109" fill="#eff6ff" stroke="#334155"/><path d="M1000 915H1400" stroke="#334155"/><text x="1012" y="904" font-family="Arial" font-size="16">errors «module»</text><text x="1012" y="936" font-family="Arial" font-size="13">PersistenceError; ConcurrentChangeError; StorageLimitError</text><text x="1012" y="956" font-family="Arial" font-size="13">ProductNotFoundError; ProductInUseError(sale_count)</text><text x="1012" y="976" font-family="Arial" font-size="13">SaleNotFoundError</text><rect x="1000" y="620" width="400" height="129" fill="#f5f3ff" stroke="#334155"/><path d="M1000 655H1400" stroke="#334155"/><text x="1012" y="644" font-family="Arial" font-size="16">SQLiteSalesRepository</text><text x="1012" y="676" font-family="Arial" font-size="13">open(path) «classmethod»; BEGIN IMMEDIATE writes</text><text x="1012" y="696" font-family="Arial" font-size="13">STRICT tables company, product, sale, sale_item</text><text x="1012" y="716" font-family="Arial" font-size="13">amounts as plain decimal TEXT; FK RESTRICT/CASCADE</text><text x="1012" y="736" font-family="Arial" font-size="13">DatabaseOpenError; CorruptDataError(table, count)</text><rect x="40" y="620" width="420" height="129" fill="#f5f3ff" stroke="#334155"/><path d="M40 655H460" stroke="#334155"/><text x="52" y="644" font-family="Arial" font-size="16">exploration «module» (pandas, lazy import)</text><text x="52" y="676" font-family="Arial" font-size="13">temporal_summary(); weekday_profile()</text><text x="52" y="696" font-family="Arial" font-size="13">category_totals(); compare_periods()</text><text x="52" y="716" font-family="Arial" font-size="13">PeriodTotal; TemporalSummary; WeekdayProfile</text><text x="52" y="736" font-family="Arial" font-size="13">CategoryTotal; PeriodComparison (Decimal fields)</text><rect x="520" y="620" width="420" height="129" fill="#f5f3ff" stroke="#334155"/><path d="M520 655H940" stroke="#334155"/><text x="532" y="644" font-family="Arial" font-size="16">charts «package»</text><text x="532" y="676" font-family="Arial" font-size="13">bar_lines(rows, width=40) (no dependency)</text><text x="532" y="696" font-family="Arial" font-size="13">images.save_charts(inputs, folder, replace) (Matplotlib Agg)</text><text x="532" y="716" font-family="Arial" font-size="13">ChartInputs; ChartWriteError</text><text x="532" y="736" font-family="Arial" font-size="13">temporary file + rename; replace only after confirmation</text><rect x="40" y="880" width="420" height="129" fill="#fffbeb" stroke="#334155"/><path d="M40 915H460" stroke="#334155"/><text x="52" y="904" font-family="Arial" font-size="16">compare_methods(history, horizon, methods, method)</text><text x="52" y="936" font-family="Arial" font-size="13">rolling origin: K blocks of 7 days, K &lt;= 4, n &gt;= 12</text><text x="52" y="956" font-family="Arial" font-size="13">MethodScore; SkippedMethod; ComparisonResult</text><text x="52" y="976" font-family="Arial" font-size="13">lowest error named only with &gt;= 14 evaluated days</text><text x="52" y="996" font-family="Arial" font-size="13">negative estimates floored at 0 and reported</text><rect x="520" y="880" width="420" height="109" fill="#fffbeb" stroke="#334155"/><path d="M520 915H940" stroke="#334155"/><text x="532" y="904" font-family="Arial" font-size="16">ForecastMethod «abstract»</text><text x="532" y="936" font-family="Arial" font-size="13">key; title; kind; min_training_days</text><text x="532" y="956" font-family="Arial" font-size="13">predict(training, days): tuple[float, ...]</text><text x="532" y="976" font-family="Arial" font-size="13">fit_summary(training): FitSummary | None</text><rect x="520" y="1040" width="420" height="109" fill="#fffbeb" stroke="#334155"/><path d="M520 1075H940" stroke="#334155"/><text x="532" y="1064" font-family="Arial" font-size="16">Concrete methods (minimum training days)</text><text x="532" y="1096" font-family="Arial" font-size="13">LastValueBaseline (1); MovingAverageBaseline (7)</text><text x="532" y="1116" font-family="Arial" font-size="13">SeasonalNaiveBaseline (14)</text><text x="532" y="1136" font-family="Arial" font-size="13">LinearTrendModel (5); WeekdayTrendModel (28)</text><rect x="1000" y="1060" width="400" height="89" fill="#f1f5f9" stroke="#334155"/><path d="M1000 1095H1400" stroke="#334155"/><text x="1012" y="1084" font-family="Arial" font-size="16">Level 1 packages (unchanged)</text><text x="1012" y="1116" font-family="Arial" font-size="13">domain; importing; analysis</text><text x="1012" y="1136" font-family="Arial" font-size="13">forecasting: daily_revenue(); RevenueForecaster</text><path d="M250 279L250 360" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="256" y="323" font-family="Arial" font-size="12" fill="#334155" stroke="white" stroke-width="4" paint-order="stroke">uses</text><path d="M460 186L520 183" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="490" y="178" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155" stroke="white" stroke-wid