<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790"><rect width="1440" height="790" fill="white"/><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#334155"/></marker><marker id="triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0L13 7L0 14Z" fill="white" stroke="#334155"/></marker></defs><text x="40" y="40" font-family="Arial" font-size="25">Level 4 — Desktop interface over the application services (implemented)</text><text x="40" y="72" font-family="Arial" font-size="13" fill="#475569">Rose: gui/ (new, the only package importing PySide6). Blue: application/. Green: cli/ presentation shared by both interfaces. Purple: level 3 adapters.</text><line x1="230" y1="202" x2="230" y2="230" stroke="#334155" marker-end="url(#open)"/><text x="234" y="212" font-family="Arial" font-size="11" fill="#475569">creates</text><line x1="322" y1="202" x2="1198" y2="640" stroke="#334155" marker-end="url(#open)"/><text x="764" y="417" font-family="Arial" font-size="11" fill="#475569">opens / closes</text><line x1="420" y1="305" x2="460" y2="303" stroke="#334155" marker-end="url(#open)"/><text x="444" y="300" font-family="Arial" font-size="11" fill="#475569">asks</text><line x1="610" y1="400" x2="610" y2="362" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#triangle)"/><line x1="610" y1="452" x2="610" y2="480" stroke="#334155" marker-end="url(#open)"/><text x="614" y="462" font-family="Arial" font-size="11" fill="#475569">runs</text><line x1="230" y1="520" x2="230" y2="492" stroke="#334155" marker-end="url(#triangle)"/><line x1="230" y1="430" x2="230" y2="398" stroke="#334155" marker-end="url(#open)"/><text x="234" y="410" font-family="Arial" font-size="11" fill="#475569">owner</text><line x1="411" y1="520" x2="800" y2="358" stroke="#334155" marker-end="url(#open)"/><text x="609" y="435" font-family="Arial" font-size="11" fill="#475569">text</text><line x1="420" y1="345" x2="800" y2="407" stroke="#334155" marker-end="url(#open)"/><text x="614" y="372" font-family="Arial" font-size="11" fill="#475569">words failures</text><line x1="1100" y1="244" x2="1140" y2="230" stroke="#334155" marker-end="url(#open)"/><text x="1124" y="233" font-family="Arial" font-size="11" fill="#475569">calls</text><line x1="950" y1="362" x2="950" y2="490" stroke="#334155" marker-end="url(#open)"/><text x="954" y="422" font-family="Arial" font-size="11" fill="#475569">formats</text><line x1="760" y1="540" x2="800" y2="542" stroke="#334155" marker-end="url(#open)"/><text x="784" y="537" font-family="Arial" font-size="11" fill="#475569">parses</text><line x1="420" y1="290" x2="1140" y2="201" stroke="#334155" marker-end="url(#open)"/><text x="784" y="242" font-family="Arial" font-size="11" fill="#475569">one per run</text><line x1="1270" y1="260" x2="1270" y2="290" stroke="#334155" marker-end="url(#open)"/><text x="1274" y="271" font-family="Arial" font-size="11" fill="#475569">builds</text><line x1="1001" y1="640" x2="1219" y2="402" stroke="#334155" marker-end="url(#open)"/><text x="1114" y="517" font-family="Arial" font-size="11" fill="#475569">from_data</text><line x1="420" y1="622" x2="800" y2="675" stroke="#334155" marker-end="url(#open)"/><text x="614" y="644" font-family="Arial" font-size="11" fill="#475569">ChartsPage</text><line x1="1270" y1="260" x2="1270" y2="430" stroke="#334155" marker-end="url(#open)"/><line x1="1270" y1="502" x2="1270" y2="640" stroke="#334155" marker-end="url(#open)"/><text x="1274" y="567" font-family="Arial" font-size="11" fill="#475569">via SalesRepository</text><line x1="658" y1="640" x2="1169" y2="260" stroke="#334155" marker-end="url(#open)"/><rect x="40" y="110" width="380" height="92" fill="#fff1f2" stroke="#334155"/><text x="48" y="128" font-family="Arial" font-size="13" font-weight="bold">gui «package»</text><text x="48" y="146" font-family="Arial" font-size="13">run(argv) -&gt; int; main()</text><text x="48" y="164" font-family="Arial" font-size="13">--database PATH, same file as the terminal</text><text x="48" y="182" font-family="Arial" font-size="13">open failure: dialog, status 2, file unchanged</text><rect x="40" y="230" width="380" height="168" fill="#fff1f2" stroke="#334155"/><text x="48" y="248" font-family="Arial" font-size="13" font-weight="bold">MainWindow</text><text x="48" y="266" font-family="Arial" font-size="13">session: SalesSession</text><text x="48" y="284" font-family="Arial" font-size="13">prompter: Prompter</text><text x="48" y="302" font-family="Arial" font-size="13">company selector, new/edit company</text><text x="48" y="320" font-family="Arial" font-size="13">period: apply / all data; selection label</text><text x="48" y="338" font-family="Arial" font-size="13">attempt(action) -&gt; T | None  «error funnel»</text><text x="48" y="356" font-family="Arial" font-size="13">perform(action) -&gt; bool</text><text x="48" y="374" font-family="Arial" font-size="13">refresh(): redraws every page from the session</text><rect x="40" y="430" width="380" height="62" fill="#fff1f2" stroke="#334155"/><text x="48" y="448" font-family="Arial" font-size="13" font-weight="bold">Page «abstract tab»</text><text x="48" y="466" font-family="Arial" font-size="13">refresh()</text><rect x="40" y="520" width="380" height="150" fill="#fff1f2" stroke="#334155"/><text x="48" y="538" font-family="Arial" font-size="13" font-weight="bold">Tabs (Page subclasses)</text><text x="48" y="556" font-family="Arial" font-size="13">CatalogPage: register / edit / delete unsold</text><text x="48" y="574" font-family="Arial" font-size="13">SalesPage: list, record, import CSV, delete</text><text x="48" y="592" font-family="Arial" font-size="13">AnalysesPage: views, missing days as zero, compare periods</text><text x="48" y="610" font-family="Arial" font-size="13">ForecastPage: linear forecast, compare methods, use method</text><text x="48" y="628" font-family="Arial" font-size="13">ChartsPage: embedded figures, save as PNG</text><rect x="460" y="230" width="300" height="132" fill="#fff1f2" stroke="#334155"/><text x="468" y="248" font-family="Arial" font-size="13" font-weight="bold">Prompter «protocol»</text><text x="468" y="266" font-family="Arial" font-size="13">inform(); warn(); confirm() -&gt; bool</text><text x="468" y="284" font-family="Arial" font-size="13">open_csv(); choose_folder()</text><text x="468" y="302" font-family="Arial" font-size="13">company_form(); product_form(); sale_form()</text><text x="468" y="320" font-family="Arial" font-size="13">(tests: ScriptedPrompter)</text><rect x="460" y="400" width="300" height="52" fill="#fff1f2" stroke="#334155"/><text x="468" y="418" font-family="Arial" font-size="13" font-weight="bold">QtPrompter</text><text x="468" y="436" font-family="Arial" font-size="13">QMessageBox, QFileDialog, forms</text><rect x="460" y="480" width="300" height="112" fill="#fff1f2" stroke="#334155"/><text x="468" y="498" font-family="Arial" font-size="13" font-weight="bold">forms «module»</text><text x="468" y="516" font-family="Arial" font-size="13">CompanyDialog -&gt; CompanyValues</text><text x="468" y="534" font-family="Arial" font-size="13">ProductDialog -&gt; ProductValues</text><text x="468" y="552" font-family="Arial" font-size="13">SaleDialog -&gt; SaleValues (Decimal from text)</text><rect x="800" y="230" width="300" height="132" fill="#fff1f2" stroke="#334155"/><text x="808" y="248" font-family="Arial" font-size="13" font-weight="bold">reports «module» (Qt-free)</text><text x="808" y="266" font-family="Arial" font-size="13">analysis_lines(); period_comparison_lines()</text><text x="808" y="284" font-family="Arial" font-size="13">forecast_lines(); comparison_report()</text><text x="808" y="302" font-family="Arial" font-size="13">missing_days(); selection_text()</text><text x="808" y="320" font-family="Arial" font-size="13">ComparisonReport</text><rect x="800" y="400" width="300" height="62" fill="#fff1f2" stroke="#334155"/><text x="808" y="418" font-family="Arial" font-size="13" font-weight="bold">messages «module» (Qt-free)</text><text x="808" y="436" font-family="Arial" font-size="13">describe_failure(error) -&gt; str</text><rect x="800" y="490" width="300" height="112" fill="#ecfdf5" stroke="#334155"/><text x="808" y="508" font-family="Arial" font-size="13" font-weight="bold">cli.formatting / cli.parsing (shared)</text><text x="808" y="526" font-family="Arial" font-size="13">format_*(); explain_forecast_error()</text><text x="808" y="544" font-family="Arial" font-size="13">describe_import_error/refusal()</text><text x="808" y="562" font-family="Arial" font-size="13">parse_amount(); parse_datetime(); parse_horizon()</text><rect x="1140" y="110" width="260" height="150" fill="#eff6ff" stroke="#334155"/><text x="1148" y="128" font-family="Arial" font-size="13" font-weight="bold">SalesSession</text><text x="1148" y="146" font-family="Arial" font-size="13">selection; current workspace</text><text x="1148" y="164" font-family="Arial" font-size="13">run_financial/product_analysis()</text><text x="1148" y="182" font-family="Arial" font-size="13">sales_over_time(); compare_forecasts()</text><text x="1148" y="200" font-family="Arial" font-size="13">+ top_products(limit) (level 4)</text><text x="1148" y="218" font-family="Arial" font-size="13">+ chart_data() (level 4)</text><rect x="1140" y="290" width="260" height="112" fill="#eff6ff" stroke="#334155"/><text x="1148" y="308" font-family="Arial" font-size="13" font-weight="bold">ChartData «value»</text><text x="1148" y="326" font-family="Arial" font-size="13">title; daily; monthly</text><text x="1148" y="344" font-family="Arial" font-size="13">top_products: ProductRevenue[]</text><text x="1148" y="362" font-family="Arial" font-size="13">forecast; forecast_title</text><text x="1148" y="380" font-family="Arial" font-size="13">forecast_refusal</text><rect x="1140" y="430" width="260" height="72" fill="#eff6ff" stroke="#334155"/><text x="1148" y="448" font-family="Arial" font-size="13" font-weight="bold">CompanyWorkspace</text><text x="1148" y="466" font-family="Arial" font-size="13">catalog, sales, import_sales()</text><text x="1148" y="484" font-family="Arial" font-size="13">(level 3, unchanged)</text><rect x="800" y="640" width="300" height="112" fill="#f5f3ff" stroke="#334155"/><text x="808" y="658" font-family="Arial" font-size="13" font-weight="bold">charts.images</text><text x="808" y="676" font-family="Arial" font-size="13">ChartInputs.from_data(data)</text><text x="808" y="694" font-family="Arial" font-size="13">build_figure(kind, inputs) -&gt; Figure</text><text x="808" y="712" font-family="Arial" font-size="13">save_charts(inputs, folder, replace)</text><rect x="1140" y="640" width="260" height="72" fill="#f5f3ff" stroke="#334155"/><text x="1148" y="658" font-family="Arial" font-size="13" font-weight="bold">SQLiteSalesRepository</text><text x="1148" y="676" font-family="Arial" font-size="13">(level 3, unchanged)</text><rect x="460" y="640" width="300" height="72" fill="#ecfdf5" stroke="#334155"/><text x="468" y="658" font-family="Arial" font-size="13" font-weight="bold">TerminalMenu (levels 2-3)</text><text x="468" y="676" font-family="Arial" font-size="13">now uses top_products(), chart_data()</text></svg>
