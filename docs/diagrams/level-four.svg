<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880"><rect width="1440" height="880" fill="white"/><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#334155"/></marker><marker id="triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0L13 7L0 14Z" fill="white" stroke="#334155"/></marker></defs><text x="40" y="40" font-family="Arial" font-size="25">Level 4 — Desktop interface, explorable charts and PDF report (implemented)</text><text x="40" y="72" font-family="Arial" font-size="13" fill="#475569">Rose: gui/ (new, the only package importing PySide6). Blue: application/. Green: cli/ presentation shared by both interfaces. Purple: level 3 adapters.</text><line x1="230" y1="202" x2="230" y2="230" stroke="#334155" marker-end="url(#open)"/><text x="234" y="212" font-family="Arial" font-size="11" fill="#475569">creates</text><line x1="322" y1="202" x2="1198" y2="640" stroke="#334155" marker-end="url(#open)"/><text x="764" y="417" font-family="Arial" font-size="11" fill="#475569">opens / closes</text><line x1="420" y1="305" x2="460" y2="303" stroke="#334155" marker-end="url(#open)"/><text x="444" y="300" font-family="Arial" font-size="11" fill="#475569">asks</text><line x1="610" y1="400" x2="610" y2="362" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#triangle)"/><line x1="610" y1="452" x2="610" y2="480" stroke="#334155" marker-end="url(#open)"/><text x="614" y="462" font-family="Arial" font-size="11" fill="#475569">runs</text><line x1="230" y1="520" x2="230" y2="492" stroke="#334155" marker-end="url(#triangle)"/><line x1="230" y1="430" x2="230" y2="398" stroke="#334155" marker-end="url(#open)"/><text x="234" y="410" font-family="Arial" font-size="11" fill="#475569">owner</text><line x1="420" y1="523" x2="800" y2="360" stroke="#334155" marker-end="url(#open)"/><text x="614" y="437" font-family="Arial" font-si