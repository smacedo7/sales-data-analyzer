55" marker-end="url(#open)"/><line x1="760" y1="756" x2="800" y2="745" stroke="#334155" marker-end="url(#open)"/><text x="784" y="746" font-family="Arial" font-size="11" fill="#475569">PNG charts</text><line x1="851" y1="362" x2="299" y2="730" stroke="#334155" marker-end="url(#open)"/><rect x="40" y="110" width="380" height="92" fill="#fff1f2" stroke="#334155"/><text x="48" y="128" font-family="Arial" font-size="13" font-weight="bold">gui «package»</text><text x="48" y="146" font-family="Arial" font-size="13">run(argv) -&gt; int; main()</text><text x="48" y="164" font-family="Arial" font-size="13">--database PATH, same file as the terminal</text><text x="48" y="182" font-family="Arial" font-size="13">open failure: dialog, status 2, file unchanged</text><rect x="40" y="230" width="380" height="168" fill="#fff1f2" stroke="#334155"/><text x="48" y="248" font-family="Arial" font-size="13" font-weight="bold">MainWindow</text><text x="48" y="266" font-family="Arial" font-size="13">session: SalesSession</text><text x="48" y="284" font-family="Arial" font-size="13">prompter: Prompter</text><text x="48" y="302" font-family="Arial" font-size="13">company selector, new/edit company</text><text x="48" y="320" font-family="Arial" font-size="13">period: apply / all data; selection label</text><text x="48" y="338" font-family="Arial" font-size="13">attempt(action) -&gt; T | None  «error funnel»</text><text x="48" y="356" font-family="Arial" font-size="13">perform(action) -&gt; bool</text><text x="48" y="374" font-family="Arial" font-size="13">refresh(): redraws every page from the session</text><rect x="40" y="430" width="380" height="62" fill="#fff1f2" stroke="#334155"/><text x="48" y="448" font-family="Arial" font-size="13" font-weight="bold">Page «abstract tab»</text><text x="48" y="466" font-family="Arial" font-size="13">refresh()</text><rect x="40" y="520" width="380" height="168" fill="#fff1f2" stroke="#334155"/><text x="48" y="538" font-family="Arial" font-size="13" font-weight="bold">Pages (side navigation)</text><text x="48" y="556" font-family="Arial" font-size="13">HomePage: company cards, demo data</text><text x="48" y="574" font-family="Arial" font-size="13">OverviewPage: indicator cards, top products</text><text x="48" y="592" font-family="Arial" font-size="13">CatalogPage / SalesPage: records, CSV import</text><text x="48" y="610" font-family="Arial" font-size="13">AnalysesPage / ForecastPage: translated tables</text><text x="48" y="628" font-family="Arial" font-size="13">ChartsPage: InteractiveChart (zoom, pan, hover)</text><text x="48" y="646" font-family="Arial" font-size="13">ReportPage: PDF preview and export</text><rect x="460" y="230" width="300" height="132" fill="#fff1f2" stroke="#334155"/><text x="468" y="248" font-family="Arial" font-size="13" font-weight="bold">Prompter «protocol»</text><text x="468" y="266" font-family="Arial" font-size="13">inform(); warn(); confirm() -&gt; bool</text><text x="468" y="284" font-family="Arial" font-size="13">open_csv(); choose_folder()</text><text x="468" y="302" font-family="Arial" font-size="13">company_form(); product_form(); sale_form()</text><text x="468" y="320" font-family="Arial" font-size="13">(tests: ScriptedPrompter)</text><rect x="460" y="400" width="300" height="52" fill="#fff1f2" stroke="#334155"/><text x="468" y="418" font-family="Arial" font-size="13" font-weight="bold">QtPrompter</text><text x="468" y="436" font-family="Arial" font-size="13">QMessageBox, QFileDialog, forms</text><rect x="460" y="480" width="300" height="112" fill="#fff1f2" stroke="#334155"/><text x="468" y="498" font-family="Arial" font-size="13" font-weight="bold">forms «module»</text><text x="468" y="516" font-family="Arial" font-size="13">CompanyDialog -&gt; CompanyValues</text><text x="468" y="534" font-family="Arial" font-size="13">ProductDialog -&gt; ProductValues</text><text x="468" y="552" font-family="Arial" font-size="13">SaleDialog -&gt; SaleValues (Decimal from text)</text><rect x="800" y="230" width="300" height="132" fill="#fff1f2" stroke="#334155"/><text x="808" y="248" font-family="Arial" font-size="13" font-weight="bold">reports «module» (Qt-free)</text><text x="808" y="266" font-family="Arial" font-size="13">financial_cards(); top_products_table()</text><text x="808" y="284" font-family="Arial" font-size="13">analysis_table(); period_comparison_table()</text><text x="808" y="302" font-family="Arial" font-size="13">linear_forecast_report(); comparison_report()</text><text x="808" y="320" font-family="Arial" font-size="13">Card, Table, Report (formatted only)</text><rect x="800" y="400" width="300" height="62" fill="#fff1f2" stroke="#334155"/><text x="808" y="418" font-family="Arial" font-size="13" font-weight="bold">messages «module» (Qt-free)</text><text x="808" y="436" font-family="Arial" font-size="13">describe_failure(error) -&gt; str</text><rect x="800" y="490" width="300" height="112" fill="#ecfdf5" stroke="#334155"/><text x="808" y="508" font-family="Arial" font-size="13" font-weight="bold">cli.formatting / cli.parsing (shared)</text><text x="808" y="526" font-family="Arial" font-size="13">format_*(); explain_forecast_error()</text><text x="808" y="544" font-family="Arial" font-size="13">describe_import_error/refusal()</text><text x="808" y="562" font-family="Arial" font-size="13">parse_amount(); parse_datetime(); parse_horizon()</text><rect x="1140" y="110" width="260" height="150" fill="#eff6ff" stroke="#334155"/><text x="1148" y="128" font-family="Arial" font-size="13" font-weight="bold">SalesSession</text><text x="1148" y="146" font-family="Arial" font-size="13">selection; current workspace</text><text x="1148" y="164" font-family="Arial" font-size="13">run_financial/product_analysis()</text><text x="1148" y="182" font-family="Arial" font-size="13">sales_over_time(); compare_forecasts()</text><text x="1148" y="200" font-family="Arial" font-size="13">+ top_products(limit) (level 4)</text><text x="1148" y="218" font-family="Arial" font-size="13">+ chart_data() (level 4)</text><rect x="1140" y="290" width="260" height="112" fill="#eff6ff" stroke="#334155"/><text x="1148" y="308" font-family="Arial" font-size="13" font-weight="bold">ChartData «value»</text><text x="1148" y="326" font-family="Arial" font-size="13">title; daily; monthly</text><text x="1148" y="344" font-family="Arial" font-size="13">top_products: ProductRevenue[]</text><text x="1148" y="362" font-family="Arial" font-size="13">forecast; forecast_title; forecast_key</text><text x="1148" y="380" font-family="Arial" font-size="13">forecast_refusal; weekday</text><rect x="1140" y="430" width="260" height="72" fill="#eff6ff" stroke="#334155"/><text x="1148" y="448" font-family="Arial" font-size="13" font-weight="bold">CompanyWorkspace</text><text x="1148" y="466" font-family="Arial" font-size="13">catalog, sales, import_sales()</text><text x="1148" y="484" font-family="Arial" font-size="13">(level 3, unchanged)</text><rect x="800" y="640" width="300" height="130" fill="#f5f3ff" stroke="#334155"/><text x="808" y="658" font-family="Arial" font-size="13" font-weight="bold">charts.images</text><text x="808" y="676" font-family="Arial" font-size="13">ChartInputs.from_data(data, weekday_names)</text><text x="808" y="694" font-family="Arial" font-size="13">build_figure(kind, inputs, labels) -&gt; Figure</text><text x="808" y="712" font-family="Arial" font-size="13">ChartLabels (English defaults for PNG)</text><text x="808" y="730" font-family="Arial" font-size="13">save_charts(inputs, folder, replace)</text><rect x="1140" y="640" width="260" height="72" fill="#f5f3ff" stroke="#334155"/><text x="1148" y="658" font-family="Arial" font-size="13" font-weight="bold">SQLiteSalesRepository</text><text x="1148" y="676" font-family="Arial" font-size="13">(level 3, unchanged)</text><rect x="40" y="730" width="380" height="92" fill="#fff1f2" stroke="#334155"/><text x="48" y="748" font-family="Arial" font-size="13" font-weight="bold">texts «module» (Qt-free)</text><text x="48" y="766" font-family="Arial" font-size="13">t(key, count=…, **values); set_language()</text><text x="48" y="784" font-family="Arial" font-size="13">PT_BR and EN catalogs with the same keys</text><text x="48" y="802" font-family="Arial" font-size="13">money(); percent(); day(); method_title()</text><rect x="460" y="750" width="300" height="92" fill="#fff1f2" stroke="#334155"/><text x="468" y="768" font-family="Arial" font-size="13" font-weight="bold">pdf_report «module»</text><text x="468" y="786" font-family="Arial" font-size="13">report_content(session) -&gt; ReportContent</text><text x="468" y="804" font-family="Arial" font-size="13">report_html(); write_pdf(content, path)</text><text x="468" y="822" font-family="Arial" font-size="13">QPdfWriter + QTextDocument, atomic</text><rect x="460" y="640" width="300" height="72" fill="#ecfdf5" stroke="#334155"/><text x="468" y="658" font-family="Arial" font-size="13" font-weight="bold">TerminalMenu (levels 2-3)</text><text x="468" y="676" font-family="Arial" font-size="13">now uses top_products(), chart_data()</text></svg>
