en»</text><text x="1012" y="776" font-family="Arial" font-size="13">sales_added; items_added</text><text x="1012" y="796" font-family="Arial" font-size="13">new_products; reused_products</text><rect x="40" y="330" width="400" height="84" fill="#f1f5f9" stroke="#334155"/><path d="M40 365H440" stroke="#334155"/><text x="52" y="354" font-family="Arial" font-size="16">FinancialAnalysis / ProductAnalysis</text><text x="52" y="386" font-family="Arial" font-size="13">level 1, unchanged</text><text x="52" y="406" font-family="Arial" font-size="13">run(data): AnalysisResult</text><rect x="520" y="980" width="400" height="84" fill="#f1f5f9" stroke="#334155"/><path d="M520 1015H920" stroke="#334155"/><text x="532" y="1004" font-family="Arial" font-size="16">Company / Product / SalesDataset / Sale</text><text x="532" y="1036" font-family="Arial" font-size="13">level 1 domain, unchanged</text><text x="532" y="1056" font-family="Arial" font-size="13">Sale creates and owns SaleItem</text><rect x="1000" y="330" width="400" height="84" fill="#f1f5f9" stroke="#334155"/><path d="M1000 365H1400" stroke="#334155"/><text x="1012" y="354" font-family="Arial" font-size="16">RevenueForecaster</text><text x="1012" y="386" font-family="Arial" font-size="13">level 1, unchanged</text><text x="1012" y="406" font-family="Arial" font-size="13">forecast(data, ...): ForecastResult</text><rect x="40" y="980" width="400" height="84" fill="#f1f5f9" stroke="#334155"/><path d="M40 1015H440" stroke="#334155"/><text x="52" y="1004" font-family="Arial" font-size="16">DataImporter / CSVImporter</text><text x="52" y="1036" font-family="Arial" font-size="13">level 1, unchanged</text><text x="52" y="1056" font-family="Arial" font-size="13">load(path, company): SalesDataset</text><path d="M720 214L720 330" fill="none" stroke="#334155"/><text x="726" y="272" text-anchor="start" font-family="Arial" font-size="12" fill="#334155">1 to 1</text><path d="M520 156L440 158" fill="none" stroke="#334155" stroke-dasharray="