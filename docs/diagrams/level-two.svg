<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Level 2 terminal menu UML overview</title>
  <desc id="desc">Planned application and command-line classes reuse the implemented sales domain, CSV importer, analyses, and revenue forecaster.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52657a"/></marker>
    <marker id="diamond" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M1,5 L6,1 L11,5 L6,9 z" fill="#3973a5" stroke="#3973a5"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #183153; }
      .title { font-size: 25px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #52657a; }
      .layer { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
      .box { fill: #e8f3ff; stroke: #3973a5; stroke-width: 2; }
      .existing { fill: #f1f2f3; stroke: #828b94; stroke-width: 2; }
      .value { fill: #eef8ed; stroke: #5c8b53; stroke-width: 2; }
      .error { fill: #fff1ed; stroke: #ba6655; stroke-width: 2; }
      .head { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .edge { fill: none; stroke: #52657a; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .edge-label { font-size: 12px; fill: #52657a; }
    </style>
  </defs>
  <rect width="1500" height="920" fill="#ffffff"/>
  <text x="40" y="45" class="title">Level 2 — Functional Terminal Menu</text>
  <text x="40" y="75" class="subtitle">Design from the approved specification. Gray components already exist in Level 1; blue and green components are to be implemented in Level 2.</text>

  <rect x="30" y="105" width="1440" height="130" rx="12" fill="#f8fbff" stroke="#d7e2ee"/>
  <text x="50" y="132" class="layer">CLI ADAPTER</text>
  <rect x="560" y="145" width="380" height="70" rx="5" class="box"/>
  <text x="580" y="172" class="head">TerminalMenu</text>
  <text x="580" y="195" class="body">reads input · calls session · renders output</text>

  <rect x="30" y="250" width="1440" height="300" rx="12" fill="#f8fbff" stroke="#d7e2ee"/>
  <text x="50" y="278" class="layer">APPLICATION</text>
  <rect x="90" y="310" width="420" height="190" rx="5" class="box"/>
  <text x="112" y="340" class="head">SalesSession</text>
  <text x="112" y="365" class="body">workspaces · selected company · active period</text>
  <text x="112" y="388" class="body">create/select company · select sales period</text>
  <text x="112" y="411" class="body">run financial/product analysis · run forecast</text>
  <text x="112" y="464" class="body">coordinates an in-memory user session</text>

  <rect x="610" y="310" width="400" height="190" rx="5" class="box"/>
  <text x="632" y="340" class="head">CompanyWorkspace</text>
  <text x="632" y="365" class="body">one Company · product catalog · SalesDataset</text>
  <text x="632" y="388" class="body">register product · record sale · import CSV</text>
  <text x="632" y="411" class="body">reject duplicates/conflicts atomically</text>
  <text x="632" y="464" class="body">business operations, without terminal I/O</text>

  <rect x="1090" y="310" width="330" height="112" rx="5" class="value"/>
  <text x="1110" y="340" class="head">Selection</text>
  <text x="1110" y="364" class="body">optional inclusive start/end dates</text>
  <text x="1110" y="389" class="body">represents all data or a period</text>
  <rect x="1090" y="438" width="330" height="80" rx="5" class="error"/>
  <text x="1110" y="467" class="head">ApplicationError</text>
  <text x="1110" y="492" class="body">typed business errors, safely displayed</text>

  <path d="M750 145 L300 145 L300 305" class="edge"/>
  <text x="405" y="137" class="edge-label">calls use cases</text>
  <path d="M510 370 L610 370" fill="none" stroke="#3973a5" stroke-width="2" marker-start="url(#diamond)"/>
  <text x="520" y="358" class="edge-label">contains workspaces</text>
  <path d="M510 445 L1090 365" class="edge"/>
  <text x="805" y="397" class="edge-label">uses period selection</text>
  <path d="M1010 450 L1090 478" class="edge"/>
  <text x="1018" y="470" class="edge-label">raises</text>

  <rect x="30" y="565" width="1440" height="310" rx="12" fill="#fafafa" stroke="#d8dce0"/>
  <text x="50" y="593" class="layer">LEVEL 1 COMPONENTS — REUSED</text>
  <rect x="85" y="630" width="340" height="105" rx="5" class="existing"/>
  <text x="105" y="660" class="head">CSVImporter</text>
  <text x="105" y="685" class="body">implements DataImporter.load(...)</text>
  <text x="105" y="710" class="body">validates CSV and returns SalesDataset</text>
  <rect x="580" y="630" width="340" height="105" rx="5" class="existing"/>
  <text x="600" y="660" class="head">Analysis</text>
  <text x="600" y="685" class="body">FinancialAnalysis · ProductAnalysis</text>
  <text x="600" y="710" class="body">shared run(data) contract</text>
  <rect x="1075" y="630" width="340" height="105" rx="5" class="existing"/>
  <text x="1095" y="660" class="head">RevenueForecaster</text>
  <text x="1095" y="685" class="body">existing linear trend + evaluation</text>
  <text x="1095" y="710" class="body">exposed by the Level 2 menu</text>
  <rect x="280" y="770" width="900" height="72" rx="5" class="existing"/>
  <text x="305" y="800" class="head">Domain model</text>
  <text x="305" y="824" class="body">Company · Product · Sale ◆— SaleItem · SalesDataset (associations to companies, products and sales)</text>
  <path d="M800 215 L800 310" class="edge"/>
  <path d="M820 500 L820 625" class="edge"/>
  <path d="M740 500 L255 625" class="edge"/>
  <path d="M920 500 L1240 625" class="edge"/>
  <path d="M750 735 L750 765" fill="none" stroke="#828b94" stroke-width="2"/>
  <text x="40" y="900" class="subtitle">Dashed arrows show “uses/depends on”; ◆ marks composition. Full editable model: level-two.drawio.</text>
</svg>
