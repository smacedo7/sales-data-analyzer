<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110"><rect width="1440" height="1110" fill="white"/><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#334155"/></marker><marker id="diamond" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto"><path d="M0 5L7 0L14 5L7 10Z" fill="#334155"/></marker></defs><text x="40" y="40" font-family="Arial" font-size="25">Level 2 — Application and terminal layers (implemented)</text><text x="40" y="68" font-family="Arial" font-size="13" fill="#475569">Green: cli/ (terminal adapter). Blue: application/. Gray: level 1 packages, unchanged. Dependencies point downwards only.</text><rect x="40" y="90" width="400" height="144" fill="#ecfdf5" stroke="#334155"/><path d="M40 125H440" stroke="#334155"/><text x="52" y="114" font-family="Arial" font-size="16">parsing «module»</text><text x="52" y="146" font-family="Arial" font-size="13">parse_text(); parse_positive_int(maximum)</text><text x="52" y="166" font-family="Arial" font-size="13">parse_amount(): Decimal; parse_date()</text><text x="52" y="186" font-family="Arial" font-size="13">parse_datetime(); parse_utc_offset()</text><text x="52" y="206" font-family="Arial" font-size="13">parse_yes_no(); parse_path()</text><text x="52" y="226" font-family="Arial" font-size="13">InputError(ValueError)</text><rect x="520" y="90" width="400" height="124" fill="#ecfdf5" stroke="#334155"/><path d="M520 125H920" stroke="#334155"/><text x="532" y="114" font-family="Arial" font-size="16">TerminalMenu</text><text x="532" y="146" font-family="Arial" font-size="13">session: SalesSession</text><text x="532" y="166" font-family="Arial" font-size="13">input_fn; output_fn (injected)</text><text x="532" y="186" font-family="Arial" font-size="13">run(): int</text><text x="532" y="206" font-family="Arial" font-size="13">options 1-12 and 0 (exit)</text><rect x="1000" y="90" width=